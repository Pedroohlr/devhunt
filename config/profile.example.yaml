# Como você escreve (o gerador imita). Quanto mais específico, menos "cara de IA".
voice:
  notes: >
    Frases curtas e diretas. Verbos no passado na primeira pessoa implícita ("Desenvolvi", "Migrei").
    Sem adjetivos vazios ("apaixonado", "dinâmico", "proativo"). Números concretos quando existirem.
    Português do Brasil coloquial-profissional; em inglês, tom simples e sem jargão corporativo.
