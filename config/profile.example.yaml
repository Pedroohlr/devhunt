# ============================================================
# PERFIL MESTRE — a única fonte de verdade sobre você.
# O currículo de cada vaga é montado SÓ com o que está aqui (nada é inventado).
# Preencha à mão ou gere um rascunho com: vagas profile import ~/Downloads/Profile.pdf
# ============================================================

personal:
  full_name: "Seu Nome Completo"
  first_name: "Seu"
  last_name: "Nome"
  email: "voce@email.com"
  phone: "+55 31 99999-9999"
  city: "Belo Horizonte"
  state: "MG"
  country: "Brasil"
  linkedin: "https://www.linkedin.com/in/seu-perfil"
  github: "https://github.com/seu-usuario"
  portfolio: ""
  birth_date: ""            # AAAA-MM-DD (só usado se um formulário exigir)
  nationality: "Brasileira"
  gender: ""                # opcional; formulários de diversidade
  disability: "Não"         # PCD?

# Título "base". O gerador adapta por vaga (ex.: "Desenvolvedor PHP Sênior").
headline: "Desenvolvedor Full Stack"

# Resumo base (2-4 linhas). O gerador reescreve por vaga mantendo os fatos.
summary: >
  Desenvolvedor com X anos construindo APIs e aplicações web para empresas de Y.
  Trabalho com Node.js, PHP e React no dia a dia, com foco em código simples de manter,
  observabilidade e entrega contínua.

# Anos de experiência total (usado em perguntas "quantos anos de experiência com ...")
years_experience_total: 8

# Habilidades: o gerador só pode usar o que está aqui.
skills:
  # Você domina e usa/usou profissionalmente. Pode virar destaque em qualquer vaga.
  primary:
    - PHP
    - Laravel
    - Node.js
    - TypeScript
    - React
    - PostgreSQL
    - MySQL
    - Docker
    - AWS
    - Git
  # Usou em projetos, consegue trabalhar, mas não é o forte.
  secondary:
    - Python
    - Vue.js
    - Redis
    - RabbitMQ
    - Kubernetes
    - GraphQL
  # Conhece / estudou / experimentou. Pode aparecer em "Conhecimentos" se a vaga pedir, nunca como principal.
  familiar:
    - Go
    - Java
    - .NET
    - Flutter

# Anos de experiência por tecnologia (para perguntas de formulário e para o gerador não exagerar)
skill_years:
  PHP: 8
  Laravel: 6
  Node.js: 5
  React: 5
  TypeScript: 4
  PostgreSQL: 6
  AWS: 4
  Python: 2

experiences:
  - company: "Empresa Atual Ltda"
    title: "Desenvolvedor Full Stack Sênior"
    start: "2021-03"
    end: ""                 # vazio = atual
    location: "Remoto"
    employment_type: "PJ"
    stack: [PHP, Laravel, Node.js, React, PostgreSQL, AWS, Docker]
    # Escreva MUITOS bullets, concretos, com números. O gerador escolhe e reescreve os mais relevantes.
    bullets:
      - "Desenvolvi a API de pagamentos em Laravel que processa ~40 mil transações/dia, com integração a 3 adquirentes."
      - "Migrei o front-end legado (jQuery) para React + TypeScript, reduzindo bugs reportados em ~30%."
      - "Implantei pipeline CI/CD (GitHub Actions + Docker) cortando o tempo de deploy de 1h para 8 min."
      - "Liderei tecnicamente um time de 4 devs, com code review, pareamento e planejamento de sprints."
      - "Criei workers em Node.js consumindo filas RabbitMQ para processamento assíncrono de relatórios."
    # Bullets alternativos para quando a vaga NÃO é de liderança (júnior/pleno)
    bullets_ic:
      - "Participei de code reviews e pareamento com o time, contribuindo com padrões de código."

  - company: "Empresa Anterior S.A."
    title: "Desenvolvedor Back-end Pleno"
    start: "2018-06"
    end: "2021-02"
    location: "Belo Horizonte, MG"
    employment_type: "CLT"
    stack: [PHP, Symfony, MySQL, Redis, Vue.js]
    bullets:
      - "Mantive e evoluí o ERP interno em Symfony usado por 200+ usuários."
      - "Otimizei consultas MySQL e caching com Redis, reduzindo o tempo de resposta médio de 1,8s para 400ms."
      - "Escrevi testes automatizados (PHPUnit) elevando a cobertura de 10% para 65%."

  - company: "Primeira Empresa"
    title: "Desenvolvedor Júnior"
    start: "2016-01"
    end: "2018-05"
    location: "Belo Horizonte, MG"
    employment_type: "CLT"
    stack: [PHP, JavaScript, MySQL]
    bullets:
      - "Desenvolvi sites e sistemas internos em PHP e JavaScript."
      - "Corrigi bugs e implementei melhorias em sistema legado."

